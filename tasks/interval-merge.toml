schema_version = 1

[task]
id = "interval-merge"
suite = "synthetic"
description = """
intervals.merge.merge must combine overlapping and touching intervals. Two intervals touch when one ends exactly where the next begins, so [1, 3] and [3, 5] are one span [1, 5]. Touching intervals are currently left separate.
"""

[fixture]
id = "interval-merge"
sha256 = "16b0b1636b7f2f1ccef9718586f5fb327fbedfc52ad524a0c4b73284af3b4a69"
# Kept out of the agent's prompt (D18). test_overlap.py stays visible: it covers
# the behaviour that already worked, which is what a repository's existing
# regression suite would cover.
hidden_paths = ["tests/test_touching.py"]

[timeouts]
per_command_ms = 30000
total_ms = 120000

[[commands]]
role = "fail_to_pass"
command = "python3 -m unittest tests.test_touching"

[[commands]]
role = "pass_to_pass"
command = "python3 -m unittest tests.test_overlap"
