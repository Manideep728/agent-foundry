# A single-broker Kafka for local development.
#
# Kafka 4.x is KRaft-only: the broker stores its own metadata in a Raft quorum
# and there is no ZooKeeper to run. One container therefore plays both roles,
# which is why `KAFKA_PROCESS_ROLES` names `broker,controller` and the quorum
# has one voter -- itself.
#
# This is explicitly a development broker and the file says so in three places:
# one replica of everything, PLAINTEXT, and a named volume rather than a
# durable path. It is not a template for the deployed configuration.
services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: af-kafka
    ports:
      # Only the client listener is published. The controller listener is
      # internal to the quorum and nothing outside the container may speak it.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # What the broker tells a client to connect back on, which is not the
      # same question as what it binds. A client resolves this name itself, so
      # it must be correct from *outside* the container: a producer that
      # bootstraps fine and then fails every send is almost always this line.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Internal topics default to three replicas, which a one-broker cluster
      # can never satisfy: the consumer group would fail to form.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Three seconds of deliberate delay before a group rebalances, so a
      # cluster starting several workers at once forms one group rather than
      # rebalancing after each. Zero would be faster here and wrong everywhere
      # else; three keeps the development path honest about the real default.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      # Off, deliberately. An auto-created topic gets one partition, and one
      # partition caps a consumer group at one worker no matter how many are
      # started -- a fan-out that silently does not fan out. A typo in a topic
      # name must fail loudly instead.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  kafka-data:
