name: CI

on:
  push:
  pull_request:

# A run that is superseded by a newer push has nothing useful to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to exact versions, like the GoogleTest tag and
# `uv sync --locked`: the version CI ran is a fact in the file, not whatever a
# moving tag points at today. setup-uv publishes no moving major tag past v7,
# so following that style would strand this workflow three majors back. Both
# versions run on node24; node20 is deprecated.

jobs:
  control-plane:
    name: control plane
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 on
    # 2026-10-19. Every green run so far was on 24.04, and the runner
    # image is part of what the C++ half is built against.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # Deliberately not `uv sync`: --locked fails rather than silently
      # resolving something different from what was committed, so CI cannot
      # pass against dependencies the author never ran.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

  # The supervisor and everything that needs it: the native C++ suite, the
  # image, and the tests that start real containers. The control-plane job has
  # no image, so its container tests skip; here they run. The one remaining
  # skip is the `ollama` marker, which needs a GPU and pulled weights no hosted
  # runner has. `-rs` prints the reason for every skip, so a test that starts
  # skipping for some other reason is visible in the log rather than silent.
  runner:
    name: runner
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 on
    # 2026-10-19. Every green run so far was on 24.04, and the runner
    # image is part of what the C++ half is built against.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build and test the runner natively
        run: make runner-test

      - name: Build the runner image
        run: make runner-image

      # The full suite, so the conformance test reads the binary built above
      # and the container tests use the image.
      - name: Test with the runner and the image
        run: uv run pytest -q -rs

      # tini as PID 1 and afrunner as its child: the supervisor must still
      # reap orphans, handle docker stop, and report pid1 honestly.
      - name: Test the container suite under --init
        run: AF_DOCKER_INIT=1 uv run pytest -q tests/test_runner_container.py

      - name: Check the runtime enforces the limits
        run: make doctor

  # The distributed path against a real broker. The other two jobs have no
  # broker, so the `kafka` tests skip there. This job starts one with the same
  # script a developer uses, runs those tests, and runs the fan-out check,
  # which measures the suite over Kafka and fails unless the result is
  # identical per task to `af bench`.
  kafka:
    name: kafka
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies with the Kafka client
        run: uv sync --locked --extra kafka

      - name: Start the broker and create the topics
        run: make kafka-up

      - name: Build the runner image
        run: make runner-image

      # The whole suite, not only `-m kafka`: the tests of how the adapter
      # reads a refused commit need the client but no broker, carry no marker,
      # and skip in the other jobs, which do not install the client. This is
      # the only job where they run. `--extra kafka` on every `uv run`, so no
      # step can re-sync the client away and turn them into skips.
      - name: Test with the broker and the client
        run: uv run --extra kafka pytest -q -rs

      - name: Check fan-out preserves the measurement
        run: make fanout-check

      # The workers again, as containers of the control-plane image: the shape
      # a deployment runs. They start the runner through the host's socket.
      - name: Build the control-plane image
        run: make control-plane-image

      - name: Check fan-out with containerised workers
        run: make fanout-check
        env:
          AF_WORKER_IMAGE: af-control-plane:local

      # The same check with the collector writing to PostgreSQL, the store a
      # deployed collector uses. A fresh server, so the database is empty, as
      # the check requires.
      - name: Start PostgreSQL
        run: make pg-up

      - name: Check fan-out into PostgreSQL
        run: make fanout-check
        env:
          AF_COLLECT_DB: postgresql://agentfoundry@localhost:5432/agentfoundry

  # The repository contract against a real PostgreSQL. The other jobs have no
  # server, so the Postgres half of the contract skips there; here it runs,
  # and `-rs` names any test that still skips.
  postgres:
    name: postgres
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Start PostgreSQL
        run: make pg-up

      - name: Test against PostgreSQL
        run: uv run pytest -q -rs -m postgres
