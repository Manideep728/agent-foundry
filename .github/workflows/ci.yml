name: CI

on:
  push:
  pull_request:

# A run that is superseded by a newer push has nothing useful to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Deliberately not `uv sync`: --locked fails rather than silently
      # resolving something different from what was committed, so CI cannot
      # pass against dependencies the author never ran.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test
