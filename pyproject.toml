[project]
name = "agentfoundry"
description = "Reproducible execution and evaluation harness for AI coding agents"
requires-python = ">=3.12"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]

# Intentionally empty. The control plane targets the standard library for v1:
# dataclasses, tomllib, sqlite3, argparse, subprocess. A provider SDK arrives
# with the first real model adapter and not before.
dependencies = []

# Kafka is an extra, not a dependency. The serial scheduler is still the
# default and needs nothing beyond the standard library, so `af run` and `af
# bench` must keep installing and working on a machine with no broker and no
# librdkafka. Only `af dispatch`, `af worker` and `af collect` require this,
# and each fails with an installation hint rather than an ImportError.
[project.optional-dependencies]
kafka = ["confluent-kafka>=2.6,<3"]

[project.scripts]
af = "control_plane.interface.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version. Reading it from the package means a
# pyproject/package mismatch is not possible rather than merely tested for.
[tool.hatch.version]
path = "control_plane/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning nobody reads is a bug nobody fixes. Deprecations in particular are
# advance notice that something will break, and this project would rather take
# the break now than during a benchmark run.
filterwarnings = ["error"]
# Markers for tests that need something the machine may not have. A laptop
# without Docker can still run the rest.
markers = [
    "docker: requires a working Docker daemon and the runner image",
    # CI runs the docker marker but not this one: the runners have no GPU and
    # no pulled model. So nothing the Ollama adapter decides may depend on it
    # -- the adapter's rules are tested against a canned HTTP server, and this
    # marker covers only the claim that a real server answers in the shape the
    # adapter expects.
    "ollama: requires a running Ollama server with the model pulled",
    # These check that the real client and the real broker agree with what
    # `tests/bus_fakes.py` models. The fake carries the semantics the rest of
    # the suite depends on, so it is the thing that must be verified, not
    # merely trusted.
    "kafka: requires a Kafka broker on AF_KAFKA_BOOTSTRAP (default localhost:9092)",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# Fixtures are benchmark data, not project source. Their defects are the
# measurement, and some are things a linter objects to: template-render's
# broken version imports an escaper it never calls, which *is* the bug.
# Linting them would either delete the bug or restrict every future task to
# one no linter can see, narrowing the benchmark to suit the tooling.
# conftest.py already keeps pytest out of `tasks/` for the same reason, and
# mypy is already scoped to `control_plane tests`.
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# The domain layer is pure logic; there is no excuse for an untyped def there,
# and strict mode is enforced across the whole package rather than per-module.
disallow_any_explicit = false

# `confluent_kafka.admin` publishes `AdminClient` and `NewTopic` as its public
# interface but does not re-export them explicitly, which strict mode refuses.
# The gap is upstream, so it is stated once here rather than as an ignore on
# every import.
[[tool.mypy.overrides]]
module = "confluent_kafka.*"
implicit_reexport = true
